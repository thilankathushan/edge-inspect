[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-inspect"
version = "0.1.0"
description = "Visual anomaly detection and hardware-aware inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow>=12,<14", "numpy>=2.3,<3"]

[project.optional-dependencies]
demo = ["streamlit>=1.55,<2"]
dev = ["pytest>=9,<10"]
onnx = ["onnx>=1.20,<2", "onnxscript>=0.5,<1", "onnxruntime>=1.24,<2", "psutil>=7,<8"]
evaluation = ["matplotlib>=3.10,<4"]
features = ["torch==2.13.0", "torchvision==0.28.0", "certifi>=2025.1.31"]

[project.scripts]
edge-inspect = "edge_inspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
