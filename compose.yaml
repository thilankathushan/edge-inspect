services:
  demo:
    build:
      context: .
      args:
        FEATURES: ${FEATURES:-false}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
